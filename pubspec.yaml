name: sailer_cli_dart
description: Eine Neuimplementierung von sailer_cli mit Dart. Es holt Werte vom SAILER Remoteportal und stellt sie per MQTT zur Verfügung.
# Please update version also in ./lib/app_info.dart
version: 0.0.2

# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.3

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  characters: ^1.4.1
  dart_mappable: ^4.10.0
  dotenv: ^4.2.0
  mqtt5_client: ^5.1.0
  puppeteer: ^3.26.0

dev_dependencies:
  build_runner: ^2.16.2
  dart_mappable_builder: ^4.10.0
  lints: ^6.0.0
  test: ^1.25.6
